# AGEN — Render.com Infrastructure as Code
# Deploy: connect this repo to Render, it will auto-read this file.
# Docs: https://render.com/docs/infrastructure-as-code
#
# Pilot topology: a single web service runs the API AND executes background jobs
# in-process via FastAPI BackgroundTasks (WORKER_MODE=local). This keeps the
# pilot cheap and simple — no Redis, no separate worker.
#
# To scale later to a distributed queue (Celery + Redis), see the commented
# "DISTRIBUTED MODE" block at the bottom of this file.

services:
  # ── Backend API (FastAPI) ───────────────────────────────────────────────────
  - type: web
    name: agen-api
    runtime: docker
    dockerfilePath: ./Dockerfile   # relative to repo root (set rootDir below)
    rootDir: agen-backend
    plan: free                     # upgrade to starter ($7/mo) for always-on
    region: singapore              # closest to Vietnam
    healthCheckPath: /health

    envVars:
      - key: APP_ENV
        value: production

      - key: APP_NAME
        value: AGEN API

      - key: APP_VERSION
        value: "1.0.0"

      # SECRET_KEY: generate with: python -c "import secrets; print(secrets.token_hex(32))"
      - key: SECRET_KEY
        generateValue: true        # Render auto-generates a secure random value

      - key: ALGORITHM
        value: HS256

      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"

      # DATABASE_URL is injected automatically by Render when linked to the DB below
      - key: DATABASE_URL
        fromDatabase:
          name: agen-db
          property: connectionString

      # ALLOWED_ORIGINS: set your Vercel frontend URL here after first deploy
      - key: ALLOWED_ORIGINS
        value: https://ai-english-learning-agent.atmarketing.vn,https://ai-english-learning-agent.vercel.app

      # AI Keys: set these manually in Render dashboard (sensitive)
      - key: GEMINI_API_KEY
        sync: false               # must be set manually in dashboard

      - key: OPENAI_API_KEY
        value: ""                 # optional — leave empty if using Gemini

      # Single uvicorn worker keeps memory within the free tier (512MB).
      # BackgroundTasks run in this same process.
      - key: WORKERS
        value: "1"

      # local = run background jobs in-process (no Redis needed).
      # Switch to "distributed" only together with a REDIS_URL (see bottom).
      - key: WORKER_MODE
        value: local

      # Daily learning reminders (optional — see docs/HUONG_DAN_QUAN_TRI.md §5.1).
      # Generate the VAPID pair with: python scripts/generate_vapid_keys.py
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: APP_URL
        sync: false
      # Copy this value into the GitHub secret REMINDER_CRON_SECRET.
      - key: REMINDER_CRON_SECRET
        generateValue: true

databases:
  # ── PostgreSQL Database ─────────────────────────────────────────────────────
  - name: agen-db
    databaseName: agen_production
    user: agen_user
    plan: free                    # 1GB storage, sufficient for development/MVP
    region: singapore

# ──────────────────────────────────────────────────────────────────────────────
# DISTRIBUTED MODE (optional upgrade — NOT enabled for the pilot)
#
# To offload AI generation to a dedicated Celery worker backed by Redis:
#   1. Add a Redis instance (Render Key Value or an external provider).
#   2. On BOTH the web service and the worker below, set:
#        WORKER_MODE = distributed
#        REDIS_URL   = <the redis connection string>
#      (config.py enforces REDIS_URL when WORKER_MODE=distributed, so never set
#       distributed without it — otherwise startup fails by design.)
#   3. Uncomment the worker service:
#
#   - type: worker
#     name: agen-worker
#     runtime: docker
#     dockerfilePath: ./Dockerfile
#     rootDir: agen-backend
#     plan: starter
#     region: singapore
