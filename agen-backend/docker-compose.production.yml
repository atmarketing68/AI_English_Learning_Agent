services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agen_production
      POSTGRES_USER: agen
      POSTGRES_PASSWORD: change-this-password
    volumes:
      - agen-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agen -d agen_production"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - agen-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    env_file: .env
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql://agen:change-this-password@postgres:5432/agen_production
      REDIS_URL: redis://redis:6379/0
      WORKER_MODE: distributed
      ALLOWED_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    env_file: .env
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql://agen:change-this-password@postgres:5432/agen_production
      REDIS_URL: redis://redis:6379/0
      WORKER_MODE: distributed
    command: sh scripts/worker.sh
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  agen-postgres:
  agen-redis:
