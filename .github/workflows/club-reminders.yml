name: Speaking club reminders

# G11 · Every 10 minutes during the day (06:00–22:59 Vietnam time = 23:00–15:59 UTC):
# remind members of booked speaking-club sessions ~15 minutes before they start.
# Uses the same secrets as the hourly reminder job; skips quietly when they are missing.
on:
  schedule:
    - cron: "*/10 0-15,23 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: club-reminders
  cancel-in-progress: false

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send club reminders
        env:
          API_URL: ${{ secrets.REMINDER_API_URL }}
          CRON_SECRET: ${{ secrets.REMINDER_CRON_SECRET }}
        run: |
          if [ -z "$API_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Reminder secrets are not set; skipping."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --max-time 180 --retry 2 --retry-delay 20 \
            -X POST "${API_URL%/}/api/v1/club/cron/remind" \
            -H "X-Cron-Secret: $CRON_SECRET"
