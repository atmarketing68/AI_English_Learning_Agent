name: Learning reminders

# Hourly trigger for daily learning reminders (web push + email).
# The backend decides who is due; this job only calls it.
# Needs repository secrets REMINDER_API_URL (e.g. https://agen-api.onrender.com)
# and REMINDER_CRON_SECRET (same value as the backend's REMINDER_CRON_SECRET).
on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: reminders
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send due reminders
        env:
          API_URL: ${{ secrets.REMINDER_API_URL }}
          CRON_SECRET: ${{ secrets.REMINDER_CRON_SECRET }}
        run: |
          if [ -z "$API_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Reminder secrets are not set; skipping."
            exit 0
          fi
          # The free Render plan may be asleep: allow time for a cold start.
          curl --fail-with-body --silent --show-error --max-time 180 --retry 2 --retry-delay 20 \
            -X POST "${API_URL%/}/api/v1/reminders/cron/run" \
            -H "X-Cron-Secret: $CRON_SECRET"
